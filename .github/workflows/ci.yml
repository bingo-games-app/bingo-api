name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bingo

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bingo
          POSTGRES_USER: bingo
          POSTGRES_PASSWORD: bingo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bingo -d bingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/bingo
      DB_USERNAME: bingo
      DB_PASSWORD: bingo_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon